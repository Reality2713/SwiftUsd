name: Check Swift C++ Overlay Compatibility
permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/check-swift-cxx-overlay-compatibility.yml"
      - "scripts/check-swift-cxx-overlay-compatibility.sh"
      - "source/SwiftOverlay/**"
  workflow_dispatch:

jobs:
  Check-Swift-Cxx-Overlay-Compatibility:
    runs-on: [self-hosted, macos]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Check Xcode version
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Check Swift C++ overlay compatibility
        run: |
          scripts/check-swift-cxx-overlay-compatibility.sh
